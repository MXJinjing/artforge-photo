<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>艺工坊·修图｜让灵感动起来</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#e8e6df;width:100%;height:100%;overflow:hidden;font-family:"PingFang SC",sans-serif}canvas{position:absolute;transform-origin:top left}#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:18px;background:#172238e8;color:white;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .2s}body:hover #controls{opacity:1}button{padding:8px 16px;border:0;border-radius:8px;color:white;background:#ffffff25;cursor:pointer}input{width:280px}body.export #controls{display:none}</style></head><body><canvas id="film" width="1920" height="1280"></canvas><div id="controls"><button id="toggle">暂停</button><button id="restart">重播</button><input id="seek" type="range" min="0" max="34" step=".01"><span id="stamp"></span></div><script>
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),W=1920,H=1280,INK='#172238',BLUE='#315aff',MINT='#a5f1ca',CORAL='#ff785c',PAPER='#f4f1e9',LAV='#cec6ff';
const assets={icon:'{{ICON}}',home:'{{HOME}}',lake:'{{LAKE}}'};const imgs={};for(const [k,v]of Object.entries(assets)){imgs[k]=new Image();imgs[k].src=v}window.assetsReady=Promise.all(Object.values(imgs).map(i=>i.decode()));
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function circle(x,y,r,fill,stroke,lw=2){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(points,color,width=3,dash=[]){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.setLineDash([])}
function txt(s,x,y,size=30,color=INK,weight=500,align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function pill(s,x,y,bg=INK,color='white',size=23){ctx.font=`500 ${size}px "PingFang SC", sans-serif`;const w=ctx.measureText(s).width+38;rr(x,y,w,48,24,bg);txt(s,x+19,y+33,size,color);return w}
function save(fn){ctx.save();fn();ctx.restore()}
function arrow(x,y,color=INK,s=1){save(()=>{ctx.translate(x,y);ctx.scale(s,s);line([[0,0],[70,0],[55,-15]],color,4);line([[70,0],[55,15]],color,4)})}
function star(x,y,r,rot,color){save(()=>{ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,rad=i%2?r*.3:r;const p=[Math.cos(a)*rad,Math.sin(a)*rad];i?ctx.lineTo(...p):ctx.moveTo(...p)}ctx.closePath();ctx.fillStyle=color;ctx.fill()})}
function cursor(x,y,angle=0){save(()=>{ctx.translate(x,y);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8,48);ctx.lineTo(20,33);ctx.lineTo(37,31);ctx.closePath();ctx.fillStyle=INK;ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke()})}
function photo(im,x,y,w,h,r=24){save(()=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();ctx.drawImage(im,x,y,w,h)})}
function bg(t,dark=false){ctx.fillStyle=dark?INK:PAPER;ctx.fillRect(0,0,W,H);const c=dark?'#ffffff0c':'#17223812';for(let x=40;x<W;x+=48)for(let y=35;y<H;y+=48)circle(x,y,1.3,c);save(()=>{ctx.translate(1500,550);ctx.rotate(t*.045);ctx.strokeStyle=dark?'#ffffff12':'#1722380b';ctx.lineWidth=1;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(0,0,380+i*85,380+i*85,0,0,7);ctx.stroke()}})}
function drawProgress(t,dark=false){ctx.fillStyle=dark?MINT:BLUE;ctx.fillRect(0,1274,1920*t/34,6)}
function tag(s,x=85,y=232,c=BLUE){txt('●  '+s,x,y,23,c,600)}
function mountain(x,y,w,h,color,phase=0){ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y+h*.63);ctx.bezierCurveTo(x+w*.18,y+h*.8,x+w*.27,y+h*(.03+phase*.04),x+w*.48,y+h*.4);ctx.bezierCurveTo(x+w*.7,y+h*.77,x+w*.79,y+h*.1,x+w,y+h*.45);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function landscape(x,y,w,h,t,variant=0){save(()=>{ctx.beginPath();ctx.roundRect(x,y,w,h,24);ctx.clip();const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,variant?'#ffd2b2':'#9ebaff');g.addColorStop(1,variant?'#fff3d6':'#d5f5f0');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);circle(x+w*.76,y+h*.24,h*.12,variant?'#ff885b':'#fff3c6');mountain(x,y+h*.19,w,h*.81,variant?'#9b8cd4':'#869ce0',t);mountain(x-w*.1,y+h*.35,w*1.2,h*.65,variant?'#5f7097':'#4e80a2',t);mountain(x,y+h*.56,w,h*.44,variant?'#2f656b':'#245d63',t);for(let i=0;i<12;i++){const px=x+w*i/11,py=y+h*.84+Math.sin(i*2.1)*h*.06;line([[px,py],[px,py-h*.09]],'#173d45',3);ctx.beginPath();ctx.moveTo(px,py-h*.16);ctx.lineTo(px-h*.035,py-h*.025);ctx.lineTo(px+h*.035,py-h*.025);ctx.closePath();ctx.fillStyle='#173d45';ctx.fill()}})}
function intro(t){bg(t);tag('一张空白，能变出什么？');txt('让灵感',85,430,112,INK,700);txt('动起来。',85,570,112,BLUE,700);txt('图层 / 调色 / 画笔',90,665,31,INK);pill('为鸿蒙平板而来',90,725,INK);const a=ease(t/1.8);save(()=>{ctx.translate(1330,635);ctx.rotate(-.13+Math.sin(t)*.04);for(let i=11;i>=0;i--){save(()=>{const angle=i*Math.PI*2/12+t*.3;ctx.translate(Math.cos(angle)*(190*(1-a)+35),Math.sin(angle)*(190*(1-a)+35));ctx.rotate(angle);rr(20,-83,330,166,83,[BLUE,CORAL,MINT,LAV][i%4]);})}circle(0,0,147,PAPER);photo(imgs.icon,-76,-76,152,152,35)});for(let i=0;i<9;i++){const a=i*2.399+t*.3,x=1320+Math.cos(a)*(350+i*10),y=620+Math.sin(a)*(320+i*4);star(x,y,15+i%3*9,t*.8+i,[BLUE,CORAL,INK][i%3])}pill('灵感 +1',1470+Math.sin(t)*22,270,CORAL,INK);pill('创作进行中',945,987,MINT,INK);txt('从这一笔，开始。',90,1050,26,'#627084')}
function layers(t){bg(t);tag('01 / 图层：把世界拆开');txt('一层一层，',85,390,88,INK,700);txt('叠出想象。',85,503,88,BLUE,700);txt('让每一个元素，各就其位。',90,589,28);pill('图层 · 合成 · PSD',90,650,INK);const spread=Math.sin(clamp(t/5)*Math.PI)*1.05;const bx=1060,by=565,w=650,h=460;for(let i=0;i<4;i++){save(()=>{const dx=(i-1.5)*100*spread,dy=(i-1.5)*150*spread;ctx.translate(bx+dx,by+dy);ctx.transform(1,-.15,.2,.88,0,0);ctx.shadowColor='#17223820';ctx.shadowBlur=35;ctx.shadowOffsetY=25;rr(-w/2,-h/2,w,h,22,i===0?'#b5ceff':'#ffffffa8','#ffffff',3);ctx.shadowColor='transparent';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,22);ctx.clip();if(i===0)circle(w*.24,-h*.23,58,'#ffe2a2');if(i>0)mountain(-w/2,-h/2+(i-1)*70,w,h-(i-1)*70,['','#a0afe7','#5c93aa','#266266'][i]);});const lx=1595,ly=405+i*105;const active=(Math.floor(t*1.25)%4)===i;rr(lx,ly,245,78,16,active?BLUE:'white');txt(['天空','远山','湖畔','前景'][i],lx+28,ly+49,25,active?'white':INK);circle(lx+210,ly+38,6,active?MINT:'#cbd3db');line([[1430+(i-1.5)*45*spread,by+(i-1.5)*132*spread],[1570,ly+39]],'#8793a650',2,[5,7])}cursor(1400+Math.sin(t*1.4)*85,730+Math.cos(t)*70);star(770,300,35,t, CORAL);txt('功能创意演绎',90,1080,20,'#81909e')}
function colorScene(t){bg(t);tag('02 / 色彩：轻轻一拉');txt('把风景，',85,368,88,INK,700);txt('调成你的心情。',85,480,88,BLUE,700);const x=815,y=265,w=1000,h=670;landscape(x,y,w,h,t,0);const p=(Math.sin(t*1.05-.8)+1)/2;save(()=>{ctx.beginPath();ctx.rect(x,y,w*p,h);ctx.clip();landscape(x,y,w,h,t,1)});line([[x+w*p,y],[x+w*p,y+h]],PAPER,5);circle(x+w*p,y+h/2,28,PAPER);txt('↔',x+w*p,y+h/2+9,30,INK,500,'center');pill('暖调',x+25,y+25,CORAL,INK);pill('冷调',x+w-110,y+25,BLUE);const gx=95,gy=605,gw=550,gh=350;rr(gx,gy,gw,gh,22,INK);for(let i=1;i<4;i++){line([[gx+25,gy+i*gh/4],[gx+gw-25,gy+i*gh/4]],'#ffffff16',1);line([[gx+i*gw/4,gy+25],[gx+i*gw/4,gy+gh-25]],'#ffffff16',1)}const cy=mix(gy+gh*.7,gy+gh*.28,p),cx=gx+gw*.55;ctx.beginPath();ctx.moveTo(gx+25,gy+gh-25);ctx.bezierCurveTo(gx+150,gy+gh-65,cx-60,cy+130,cx,cy);ctx.bezierCurveTo(cx+70,cy-80,gx+gw-80,gy+100,gx+gw-25,gy+25);ctx.strokeStyle=MINT;ctx.lineWidth=6;ctx.stroke();circle(cx,cy,13,MINT);circle(cx,cy,25,null,'#a5f1ca55');cursor(cx+6,cy+5);txt('曲线在动，光影也在动。',95,1020,28);pill('色彩 / 光影',1270,1008,MINT,INK);star(1745,1040,32,t*.5,BLUE);txt('功能创意演绎',90,1100,20,'#81909e')}
function brush(t){bg(t);tag('03 / 画笔：给灵感一条线');txt('不必规规矩矩。',85,365,94,INK,700);txt('画出你的节奏。',85,490,94,BLUE,700);const count=220,p=ease((t-.35)/2.8),pts=[];for(let i=0;i<=count;i++){const u=i/count;pts.push([180+1540*u,790+Math.sin(u*8.5-1)*145+Math.sin(u*17)*35])}save(()=>{ctx.shadowColor='#315aff30';ctx.shadowBlur=30;for(let i=1;i<Math.max(2,count*p);i++){const u=i/count;line([pts[i-1],pts[i]],u<.33?BLUE:u<.67?CORAL:'#75cfac',18+45*(Math.sin(u*Math.PI)**2))}});const tip=pts[Math.floor(count*p)];save(()=>{ctx.translate(...tip);ctx.rotate(-.65);rr(-15,-140,30,125,12,INK);ctx.beginPath();ctx.moveTo(-15,-17);ctx.lineTo(0,14);ctx.lineTo(15,-17);ctx.closePath();ctx.fillStyle=CORAL;ctx.fill()});for(let i=0;i<22;i++){const a=i*2.399+t,rad=50+(i%6)*16;const life=clamp((t-1)/1.2);circle(tip[0]+Math.cos(a)*rad,tip[1]+Math.sin(a)*rad,3+i%4,[BLUE,CORAL,'#75cfac'][i%3]);}star(1640,350,95,-t*.3,CORAL);star(1455,475,40,t,INK);pill('大小',190,1050,INK);pill('硬度',310,1050,BLUE);pill('笔尖',430,1050,CORAL,INK);txt('落笔，就有回应。',1540,1080,28,INK,500,'right');txt('功能创意演绎',90,1150,18,'#81909e')}
function doc(x,y,t,color=BLUE){save(()=>{ctx.translate(x,y);ctx.rotate(Math.sin(t)*.06);rr(-105,-135,210,270,15,PAPER);rr(-78,-105,80,17,4,color);for(let i=0;i<6;i++)rr(-78,-57+i*28,105+((i+1)%3)*17,7,3,'#9aa8b8');rr(-78,99,55,9,3,color)})}
function cleanStudy(t){bg(t,true);tag('技术背后 / 上游 PhotoCraft',85,230,MINT);txt('熟悉的工作流，',85,365,88,PAPER,700);txt('从理解开始。',85,475,88,MINT,700);const a=ease(t/1.2);doc(330,800,t,BLUE);doc(420,830,t+.5,CORAL);txt('公开规范与论文',390,1050,29,PAPER,600,'center');arrow(670,810,MINT,1.6);save(()=>{ctx.translate(1080,800);for(let i=3;i>=0;i--)rr(-220+i*16,-160-i*14,440,320,22,['#35526c','#43647f','#66809b','#f4f1e9'][i]);landscape(-195,-135,390,265,t,0);const scan=-180+360*((t*.5)%1);line([[scan,-140],[scan,140]],CORAL,6);cursor(75+Math.sin(t*2)*70,Math.cos(t*2)*50);for(let i=0;i<4;i++){const yy=-105+i*65;line([[scan-20,yy],[scan+20,yy]],BLUE,2)}});txt('观察操作与输出',1080,1050,29,PAPER,600,'center');arrow(1370,810,MINT,1.6);save(()=>{ctx.translate(1650,800);ctx.rotate(t*.25);for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);rr(80,-15,65,30,8,MINT)}circle(0,0,100,MINT);circle(0,0,62,INK);txt('{ }',0,18,54,PAPER,600,'center')});txt('梳理编辑逻辑',1650,1050,29,PAPER,600,'center');pill('净室开发 CLEAN-ROOM',1280,372,MINT,INK);txt('研究行为与公开资料，独立编写实现。',85,1140,25,'#aebccc')}
function rebuild(t){bg(t,true);tag('净室开发 / 独立实现',85,230,MINT);txt('把理解，',85,375,96,PAPER,700);txt('写成创造力。',85,500,96,MINT,700);txt('用 Rust 重建编辑引擎',90,590,31,PAPER);txt('不复制专有代码、着色器或素材。',90,648,26,'#aebccc');const follow=ease((t-1.7)/.75);save(()=>{ctx.globalAlpha=follow;txt('持续追踪 PhotoCraft 上游更新',90,760,31,MINT,600);txt('跟进新功能，适配鸿蒙体验。',90,813,26,'#aebccc');pill('上游更新',1000,285,MINT,INK);arrow(1155,309,MINT,1.05);pill('鸿蒙适配',1260,285,BLUE,PAPER);circle(1150+((t*.6)%1)*87,309,6,CORAL)});const p=ease((t-.25)/2.8),cx=1310,cy=650;const names=['图层','色彩','画笔','合成','文档','引擎'];for(let i=0;i<6;i++){const col=i%3,row=Math.floor(i/3),tx=cx+(col-1)*180,ty=cy+(row-.5)*180;const angle=i*1.7;const x=mix(cx+Math.cos(angle+t)*520,tx,p),y=mix(cy+Math.sin(angle+t)*380,ty,p);save(()=>{ctx.translate(x,y);ctx.rotate((1-p)*(i%2?1:-1));rr(-79,-79,158,158,24,[BLUE,MINT,CORAL,LAV,'#fff1b9','#74c9e6'][i]);txt(names[i],0,12,32,i===0?PAPER:INK,650,'center')})}const reveal=smooth((t-3)/1.1);save(()=>{ctx.globalAlpha=reveal;rr(1000,420,620,460,32,null,MINT,3);line([[980,400],[1020,400]],MINT,3);line([[980,400],[980,440]],MINT,3);line([[1640,900],[1600,900]],MINT,3);line([[1640,900],[1640,860]],MINT,3);pill('ENGINE / READY',1123,958,MINT,INK)});for(let i=0;i<24;i++){const a=i*2.4+t*.15;circle(cx+Math.cos(a)*(340+i%3*40),cy+Math.sin(a)*(310+i%3*40),2+i%3,i%2?MINT:CORAL)}star(785,845,60,t*.4,MINT);txt('上游开源引擎 PhotoCraft + HarmonyOS 原生适配',90,1080,29,PAPER);txt('净室开发说明依据上游文档；功能持续完善中。',90,1140,20,'#aebccc')}
function finale(t){bg(t);tag('艺工坊·修图');txt('你的灵感，',85,395,94,INK,700);txt('现在开工。',85,520,94,BLUE,700);txt('图层 · 调色 · 画笔',90,615,32);pill('即刻开启创作  ↗',90,685,BLUE,'white',29);const s=ease(t/.9);save(()=>{ctx.translate(1335,675);ctx.rotate(-.025);ctx.scale(.9+.1*s,.9+.1*s);ctx.shadowColor='#17223825';ctx.shadowBlur=60;ctx.shadowOffsetY=25;photo(imgs.home,-510,-344,1020,688,35)});for(let i=0;i<6;i++){const a=i*Math.PI/3+t*.25,x=1320+Math.cos(a)*570,y=670+Math.sin(a)*420;star(x,y,18+i%3*10,a,[BLUE,CORAL,'#6ccca1'][i%3])}pill('图层 +1',820+Math.sin(t)*20,245,MINT,INK);pill('灵感已就位',1465,1068,CORAL,INK);txt('真实应用画面',90,1005,23,'#627084');txt('基于 PhotoCraft 开源项目 · HarmonyOS 原生适配',90,1080,24,'#627084')}
const cuts=[0,4,9,14,19,23,29,34],draws=[intro,layers,colorScene,brush,cleanStudy,rebuild,finale];let playing=true,time=0,last=performance.now();
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`scale(${s})`;cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=(innerHeight-H*s)/2+'px'}addEventListener('resize',resize);resize();
window.renderAt=function(t){time=Math.max(0,Math.min(34,t));let i=6;for(let n=0;n<7;n++)if(time>=cuts[n]&&time<cuts[n+1]){i=n;break}const local=time-cuts[i];draws[i](local);drawProgress(time,i===4||i===5);const transition=1-ease(local/.42);if(i>0&&transition>0){ctx.fillStyle=i===4||i===5?MINT:BLUE;ctx.fillRect(W*(1-transition),0,W*transition,H)}document.querySelector('#seek').value=time;document.querySelector('#stamp').textContent=Math.floor(time)+' / 34';return time};
window.pause=()=>{playing=false;document.querySelector('#toggle').textContent='播放'};document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'暂停':'播放'};document.querySelector('#restart').onclick=()=>{time=0;playing=true};document.querySelector('#seek').oninput=e=>{pause();renderAt(+e.target.value)};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.querySelector('#toggle').click()}});if(new URLSearchParams(location.search).has('export')){document.body.classList.add('export');playing=false}function tick(now){if(playing){time+=(now-last)/1000;if(time>34)time=0;renderAt(time)}last=now;requestAnimationFrame(tick)}assetsReady.then(()=>{renderAt(0);requestAnimationFrame(tick)});
</script></body></html>
